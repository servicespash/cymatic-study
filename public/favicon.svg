<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cymatic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="220" fill="url(#glow)" />
  
  <!-- Ambient Cymatic Resonance Waves -->
  <circle cx="256" cy="256" r="180" stroke="url(#cymatic-grad)" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" stroke="url(#cymatic-grad)" stroke-width="3" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="100" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45" />

  <!-- Central Crest -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="url(#cymatic-grad)" filter="url(#shadow)" />
  
  <!-- Lightning Bolt Icon Core -->
  <path d="M280 144L176 272H256L232 368L336 240H256L280 144Z" fill="#ffffff" stroke="#e0f2fe" stroke-width="6" stroke-linejoin="round" />
</svg>
