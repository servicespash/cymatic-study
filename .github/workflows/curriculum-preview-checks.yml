name: Curriculum preview checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/aep-library-and-pages-ingest

permissions:
  contents: read

concurrency:
  group: curriculum-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npx prettier --check \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/routes/aep.tsx \
            src/server/curriculum-ingest.ts \
            functions/api/curriculum-ingest.ts \
            scripts/validate-aep-study-aids.mjs \
            package.json

      - name: Lint changed application code
        run: |
          npx eslint --quiet \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/routes/aep.tsx \
            src/server/curriculum-ingest.ts

      - name: Validate AEP study-aid content
        run: npm run validate:aep-study-aids

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
