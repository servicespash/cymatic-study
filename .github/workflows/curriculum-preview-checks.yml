name: Curriculum preview checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix-curriculum-ingest-pdf

permissions:
  contents: read

concurrency:
  group: curriculum-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint changed curriculum code, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint changed curriculum code
        run: |
          npx eslint --quiet \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/server/curriculum-ingest.ts

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
