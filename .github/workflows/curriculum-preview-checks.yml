name: Curriculum preview checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/aep-library-and-pages-ingest

permissions:
  contents: write

concurrency:
  group: curriculum-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/aep-library-and-pages-ingest
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format changed application files
        run: |
          npx prettier --write \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/routes/aep.tsx \
            src/server/curriculum-ingest.ts \
            functions/api/curriculum-ingest.ts

      - name: Apply safe ESLint autofixes
        run: |
          npx eslint --fix \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/routes/aep.tsx \
            src/server/curriculum-ingest.ts \
      - name: Persist formatter fixes to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/components/NoteHierarchy.tsx src/components/curriculum/AepCurriculumIndex.tsx src/lib/curriculum-parser.ts src/routes/developer-console.tsx src/routes/lessons.tsx src/routes/aep.tsx src/server/curriculum-ingest.ts functions/api/curriculum-ingest.ts
            git commit -m "style(aep): format curriculum library and ingestion route"
            git push origin HEAD:feat/aep-library-and-pages-ingest
          fi

      - name: Lint changed curriculum code
        run: |
          npx eslint --quiet \
            src/components/NoteHierarchy.tsx \
            src/components/curriculum/AepCurriculumIndex.tsx \
            src/lib/curriculum-parser.ts \
            src/routes/developer-console.tsx \
            src/routes/lessons.tsx \
            src/routes/aep.tsx \
            src/server/curriculum-ingest.ts \
      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
